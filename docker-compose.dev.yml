version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ged-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gedpassword}
      POSTGRES_DB: ${POSTGRES_DB:-geddb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - ged-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geduser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: ged-mongodb-dev
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-GEDPRO}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - ged-network-dev
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
  mongodb_data_dev:

networks:
  ged-network-dev:
    driver: bridge

