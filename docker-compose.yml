version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ged-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gedpassword}
      POSTGRES_DB: ${POSTGRES_DB:-geddb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ged-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geduser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: ged-mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-GEDPRO}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ged-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - ged-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ged-app
    environment:
      NODE_ENV: production
      PORT: 3000
      # PostgreSQL Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-geduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gedpassword}
      POSTGRES_DB: ${POSTGRES_DB:-geddb}
      # MongoDB Configuration
      MONGO_URI: mongodb://mongodb:27017/${MONGO_DB:-GEDPRO}
      # MinIO Configuration
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-gedpro-documents}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-mon-super-secret-jwt-changez-moi-en-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ged-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  minio_data:

networks:
  ged-network:
    driver: bridge

